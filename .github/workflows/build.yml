name: Node.js CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Create constants.ts
        run: |
          cat > src/constants.ts <<EOF
          export const constants = {
              url: 'https://codingneko.com',
              misskeyApiUrl: 'https://codingneko.com/api/emojis',
              githubApiUrl: 'https://api.github.com/graphql',
              githubAuthToken: '${{ secrets.GITHUB_VIEW_TOKEN }}',
              misskeyAuthToken: '${{ secrets.MISSKEY_TOKEN }}',
              misskeyFolderId: '${{ vars.MISSKEY_FOLDER_ID }}'
          };
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          
  deploy:
    runs-on: ubuntu-latest
    environment: "CodingNeko server"
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configure SSH
        run: |
          if [ -z "${{ secrets.SERVER_PRIV_KEY }}" ]; then
            echo "Missing required secret: SERVER_PRIV_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SERVER_PRIV_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan codingneko.com >> ~/.ssh/known_hosts

      - name: Deploy via SCP
        run: |
          scp -r dist root@codingneko.com:/var/www/codingneko.com/
