name: Node.js CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Create constants.ts
        run: |
          cat > src/constants.ts <<EOF
          export const constants = {
              url: 'https://codingneko.com',
              misskeyApiUrl: 'https://codingneko.com/api/emojis',
              githubApiUrl: 'https://api.github.com/graphql',
              githubAuthToken: '${{ secrets.GITHUB_TOKEN }}',
              misskeyAuthToken: '${{ secrets.MISSKEY_TOKEN }}',
              misskeyFolderId: '${{ vars.MISSKEY_FOLDER_ID }}'
          };
          EOF
          
      - name: Install dependencies and build
        run: npm i && npm run build
        
      - name: Configure SSH
        if: github.event_name == 'push'
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SERVER_PRIV_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan codingneko.com >> ~/.ssh/known_hosts
          
      - name: Validate SSH key file
        run: |
          ls -l ~/.ssh/id_rsa
          file ~/.ssh/id_rsa || true
      
      - name: Upload built code
        if: github.event_name == 'push'
        run: |
          scp -r dist root@codingneko.com:/var/www/codingneko.com/
